hero_chassis_controller:
  type: hero_chassis_controller/HeroChassisController

  joints:
    - left_front_wheel_joint
    - right_front_wheel_joint
    - left_back_wheel_joint
    - right_back_wheel_joint


  wheel_radius: 0.07625
  wheel_base: 0.4
  wheel_track: 0.4

  # Velocity command frame: chassis (default) or global
  # global reads /cmd_vel in world_frame, then rotates it into base_link with tf
  velocity_mode: chassis
  world_frame: odom

  pid:
    left_front_wheel_joint:
      p: 5.0
      i: 0.0
      d: 0.0
      i_clamp_max: 1.0
      i_clamp_min: -1.0
    right_front_wheel_joint:
      p: 5.0
      i: 0.0
      d: 0.0
      i_clamp_max: 1.0
      i_clamp_min: -1.0
    left_back_wheel_joint:
      p: 5.0
      i: 0.0
      d: 0.0
      i_clamp_max: 1.0
      i_clamp_min: -1.0
    right_back_wheel_joint:
      p: 5.0
      i: 0.0
      d: 0.0
      i_clamp_max: 1.0
      i_clamp_min: -1.0

joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 50
